name: Build and check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Test application logic
        run: ./test.ps1
      - name: Test release tools
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Publish single executable
        run: ./build.ps1 -Runtime '${{ matrix.runtime }}' -Locked
      - name: Check public source and artifacts
        run: >-
          python tools/privacy_check.py
          --artifact 'dist/${{ matrix.runtime }}/HapticBridge.exe'
          --artifact 'source/bin/Release/net10.0-windows10.0.19041.0/${{ matrix.runtime }}/HapticBridge.dll'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HapticBridge-${{ matrix.runtime }}
          path: dist/${{ matrix.runtime }}/HapticBridge.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
